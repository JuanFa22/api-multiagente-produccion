# Levanta Redis. La API se corre con uvicorn desde tu venv (más simple para depurar).
services:
  redis:
    image: redis:7-alpine
    container_name: multiagente-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]   # persistencia en disco: sobrevive al reinicio del contenedor
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
